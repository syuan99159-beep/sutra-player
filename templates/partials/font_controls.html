<div class="font-controls" aria-label="字體大小設定">
    <button
        class="font-button"
        data-size="small"
        type="button"
        aria-pressed="false"
    >
        小 15
    </button>

    <button
        class="font-button active"
        data-size="medium"
        type="button"
        aria-pressed="true"
    >
        中 20
    </button>

    <button
        class="font-button"
        data-size="large"
        type="button"
        aria-pressed="false"
    >
        大 28
    </button>
</div>
